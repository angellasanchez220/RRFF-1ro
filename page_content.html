      /* Contenedor a pantalla completa y centrado vertical/horizontal */
      .portal-viewport {
        min-height: 40vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 0;
      }

      /* Caja interior */
      .portal-wrap     { width: 100%; max-width: 1000px; padding: 0 20px; text-align: center; }
      .portal-header   { display:flex; flex-direction:column; align-items:center; gap:0px; margin-bottom: 0px; }
      .portal-logo     { max-height: 140px; height:auto; width:auto; }

      .card { border-radius: 14px; border: 1px solid #e5e7eb; padding: 18px; margin-bottom: 14px; }
      .muted { color:#6b7280; font-size: 13px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr); /* fuerza 5 por fila */
        gap: 18px;
        justify-content: center;    /* centra el conjunto en horizontal */
        justify-items: center;      /* centra cada tarjeta en su celda */
        align-items: start;
        margin: 0 auto;
        max-width: 1200px;
      }

      /* En pantallas medianas (hasta 1100px): 2 por fila */
      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
          justify-content: center;   /* mantiene centrado el conjunto */
        }
      }
      
      /* En móviles (hasta 700px): 1 por fila */
      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
          justify-content: center;   /* sigue centrado */
        }
      }

      .btn-primary, .btn {

      .btn-primary:hover, .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(122,185,67,.35); filter: brightness(0.96); }
      .btn-primary:focus, .btn:focus { box-shadow: 0 0 0 3px rgba(122,185,67,.35) !important; }
